[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-skills"
version = "0.1.0"
description = "Skill registry and tool library for the Forge Answer Engine"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["forge_skills"]
